{% extends 'base.html' %}
{% block title %}Delete Item – ReSource{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <div class="mb-3">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
      </div>
      <h4 class="fw-bold">Delete "{{ item.title }}"?</h4>
      <p class="text-muted">This action cannot be undone. All rental requests for this item will also be deleted.</p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger fw-bold">Yes, Delete It</button>
          <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
